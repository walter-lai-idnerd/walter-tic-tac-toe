<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: background 0.3s ease;
        }

        body.mid-autumn {
            background: linear-gradient(135deg, #d4a574 0%, #c87137 100%);
        }

        .header {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .player-info {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 600;
            min-height: 30px;
            transition: color 0.3s ease;
        }

        body.mid-autumn .player-info {
            color: #c87137;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 8px;
            margin-bottom: 30px;
            background: #667eea;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        body.mid-autumn .board {
            background: #c87137;
        }

        .cell {
            background: white;
            border: none;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(:disabled) {
            background: #f0f0f0;
            transform: scale(0.95);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        body.mid-autumn .cell.x {
            color: #d4a574;
        }

        body.mid-autumn .cell.o {
            color: #c87137;
        }

        .result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .result-overlay.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .result-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            animation: celebrate 0.6s ease;
        }

        @keyframes celebrate {
            0% {
                transform: scale(0.5) rotateZ(-5deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1) rotateZ(5deg);
            }
            100% {
                transform: scale(1) rotateZ(0deg);
                opacity: 1;
            }
        }

        .result-card h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #667eea;
        }

        body.mid-autumn .result-card h2 {
            color: #c87137;
        }

        .winner-symbol {
            font-size: 4em;
            margin: 20px 0;
            animation: bounce 0.6s ease infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #667eea;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        .confetti.falling {
            animation: fall 3s linear forwards;
        }

        body.mid-autumn .confetti {
            background: #d4a574;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="theme-toggle" id="themeToggle">🌙 Mid-Autumn</button>
    </div>

    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div class="player-info">Current Player: <span id="currentPlayer">X</span></div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <h2 id="resultMessage"></h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const currentPlayerDisplay = document.getElementById('currentPlayer');
        const board = document.getElementById('board');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultMessage = document.getElementById('resultMessage');
        const resultContent = document.getElementById('resultContent');
        const themeToggle = document.getElementById('themeToggle');

        let gameState = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let isMidAutumnTheme = false;

        const winConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function getDisplaySymbol(player) {
            if (!isMidAutumnTheme) {
                return player;
            }
            return player === 'X' ? '🧧' : '🏮';
        }

        function checkWin() {
            for (let condition of winConditions) {
                const [a, b, c] = condition;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    return true;
                }
            }
            return false;
        }

        function isBoardFull() {
            return gameState.every(cell => cell !== '');
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.classList.add('falling');
                }, 10);

                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        function showResult(winner) {
            createConfetti();
            resultOverlay.classList.add('show');

            if (winner) {
                resultMessage.textContent = '🎉 ' + winner + ' Wins! 🎉';
                resultContent.innerHTML = `<div class="winner-symbol">${getDisplaySymbol(winner)}</div>`;
            } else {
                resultMessage.textContent = "It's a Tie!";
                resultContent.innerHTML = '<p style="font-size: 1.5em; margin-top: 20px;">Well Played!</p>';
            }

            setTimeout(() => {
                resetGame();
            }, 3000);
        }

        function resetGame() {
            resultOverlay.classList.remove('show');
            gameState = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            currentPlayerDisplay.textContent = getDisplaySymbol('X');

            cells.forEach(cell => {
                cell.textContent = '';
                cell.disabled = false;
                cell.classList.remove('x', 'o');
            });
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.dataset.index;

            if (gameState[index] !== '' || !gameActive) {
                return;
            }

            gameState[index] = currentPlayer;
            cell.textContent = getDisplaySymbol(currentPlayer);
            cell.classList.add(currentPlayer.toLowerCase());
            cell.disabled = true;

            if (checkWin()) {
                gameActive = false;
                showResult(currentPlayer);
                return;
            }

            if (isBoardFull()) {
                gameActive = false;
                showResult(null);
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            currentPlayerDisplay.textContent = getDisplaySymbol(currentPlayer);
        }

        function toggleTheme() {
            isMidAutumnTheme = !isMidAutumnTheme;
            document.body.classList.toggle('mid-autumn');
            themeToggle.textContent = isMidAutumnTheme ? '🎮 Normal' : '🌙 Mid-Autumn';
            currentPlayerDisplay.textContent = getDisplaySymbol(currentPlayer);
            updateCellDisplays();
        }

        function updateCellDisplays() {
            cells.forEach((cell, index) => {
                if (gameState[index]) {
                    cell.textContent = getDisplaySymbol(gameState[index]);
                }
            });
        }

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        themeToggle.addEventListener('click', toggleTheme);

        currentPlayerDisplay.textContent = getDisplaySymbol('X');
    </script>
</body>
</html>
